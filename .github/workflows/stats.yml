name: generate stats

on:
  schedule:
    - cron: "0 3 * * *"      # daily, 03:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download github-stats
        run: |
          GITHUB_STATS_VERSION="2.0.1"
          GITHUB_STATS_SHA256="5e15e02803559cec5b5bdae4f202939846789c4cd3a34cfd24ee9ff13d6902c5"
          curl --fail --location --output ./github-stats \
            "https://github.com/jstrieb/github-stats/releases/download/${GITHUB_STATS_VERSION}/github-stats_x86_64-linux"
          echo "${GITHUB_STATS_SHA256}  ./github-stats" | sha256sum --check
          chmod +x ./github-stats

      - name: Generate stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDED_LANGS: "HTML,CSS,Blade,SCSS,Dockerfile,Shell"
          EXCLUDE_FORKED_REPOS: "true"
          SILENT: "true"
        run: ./github-stats
