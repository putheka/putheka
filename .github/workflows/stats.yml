name: generate stats

on:
  schedule:
    - cron: "0 3 * * *"      # daily, 03:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download github-stats
        run: |
          curl --fail --location --output ./github-stats \
            https://github.com/jstrieb/github-stats/releases/latest/download/github-stats_x86_64-linux
          chmod +x ./github-stats

      - name: Generate stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_LANGS: "HTML,CSS,Blade,SCSS,Dockerfile,Shell"
          EXCLUDE_FORKED_REPOS: "true"
          SILENT: "true"
        run: ./github-stats
