<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Full-stack engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="900" height="260" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)" opacity="0.45"/>

    <!-- glow -->
    <circle cx="820" cy="40" r="150" fill="#3b82f6" opacity="0.10"/>
    <circle cx="60" cy="240" r="120" fill="#22d3ee" opacity="0.07"/>

    <!-- top accent bar -->
    <rect x="0" y="0" width="900" height="3" fill="url(#accent)"/>

    <!-- window chrome -->
    <circle cx="28" cy="30" r="5.5" fill="#ef4444" opacity="0.85"/>
    <circle cx="48" cy="30" r="5.5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="68" cy="30" r="5.5" fill="#22c55e" opacity="0.85"/>
    <text x="92" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#475569">~/profile</text>

    <!-- headline -->
    <text x="40" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="42" font-weight="700" fill="#e2e8f0">
      full-stack
      <tspan fill="url(#accent)"> engineer</tspan>
    </text>

    <!-- prompt lines -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>
        <text x="40" y="152" fill="#3b82f6">▸</text>
        <text x="62" y="152" fill="#94a3b8">builds systems that survive contact with reality</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
        <text x="40" y="180" fill="#3b82f6">▸</text>
        <text x="62" y="180" fill="#94a3b8">tests first · typed contracts · reversible deploys</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
        <text x="40" y="208" fill="#3b82f6">▸</text>
        <text x="62" y="208" fill="#94a3b8">logistics · payments · commerce</text>
        <rect x="348" y="196" width="9" height="16" fill="#22d3ee">
          <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- status pill -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.2s" fill="freeze"/>
      <rect x="700" y="188" width="164" height="34" rx="17" fill="#0b1220" stroke="#1e3a8a"/>
      <circle cx="722" cy="205" r="5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="736" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#86efac">open to collab</text>
    </g>

    <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#1e293b"/>
  </g>
</svg>